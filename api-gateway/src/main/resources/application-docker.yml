spring:
  data:
    redis:
      url: ${REDIS_URL:redis://redis:6379}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:9000/realms/ticketcraft}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://keycloak:8080/realms/ticketcraft/protocol/openid-connect/certs}
          audiences: ${JWT_AUDIENCE:ticketcraft-api}

ticketcraft:
  gateway:
    catalog-uri: ${GATEWAY_CATALOG_URI:http://catalog-service:8081}
    order-uri: ${GATEWAY_ORDER_URI:http://order-service:8082}

management:
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://jaeger:4318/v1/traces}
