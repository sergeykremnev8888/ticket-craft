server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: none

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s

  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000
            response-timeout: 5s
            pool:
              type: fixed
              name: gateway
              max-connections: ${GATEWAY_HTTP_POOL_MAX_CONNECTIONS:64}
              acquire-timeout: ${GATEWAY_HTTP_POOL_ACQUIRE_TIMEOUT_MS:500}
              max-idle-time: 30s
              max-life-time: 5m
              eviction-interval: 10s
              metrics: true

          routes:
            - id: order-service-route
              uri: ${ticketcraft.gateway.order-uri:http://localhost:8082}
              predicates:
                - Path=/api/v1/orders,/api/v1/orders/**
              filters:
                - name: ProblemRequestRateLimiter
                  args:
                    rate-limiter: "#{@resilientRateLimiter}"
                    key-resolver: "#{@userKeyResolver}"
                    deny-empty-key: true
                    empty-key-status: FORBIDDEN
                    throw-on-limit: false
                    '[redis-rate-limiter.replenishRate]': 5
                    '[redis-rate-limiter.burstCapacity]': 10
                    '[redis-rate-limiter.requestedTokens]': 1
                - name: CircuitBreaker
                  args:
                    name: orderCircuitBreaker
                    statusCodes: "500,502,503,504"
                    fallbackUri: forward:/fallback/order

            - id: catalog-service-route
              uri: ${ticketcraft.gateway.catalog-uri:http://localhost:8081}
              predicates:
                - Path=/api/v1/catalog/events,/api/v1/catalog/events/**
              filters:
                - name: ProblemRequestRateLimiter
                  args:
                    rate-limiter: "#{@resilientRateLimiter}"
                    key-resolver: "#{@ipKeyResolver}"
                    '[redis-rate-limiter.replenishRate]': 10
                    '[redis-rate-limiter.burstCapacity]': 20
                    '[redis-rate-limiter.requestedTokens]': 1
                - name: CircuitBreaker
                  args:
                    name: catalogCircuitBreaker
                    statusCodes: "500,502,503,504"
                    fallbackUri: forward:/fallback/catalog

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:9000/realms/ticketcraft}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://localhost:9000/realms/ticketcraft/protocol/openid-connect/certs}
          audiences: ${JWT_AUDIENCE:ticketcraft-api}

  data:
    redis:
      url: ${REDIS_URL:redis://localhost:6379}
      timeout: 500ms

  reactor:
    context-propagation: auto

resilience4j:
  circuitbreaker:
    instances:
      catalogCircuitBreaker:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        slowCallDurationThreshold: 2s
        slowCallRateThreshold: 50

      orderCircuitBreaker:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        slowCallDurationThreshold: 2s
        slowCallRateThreshold: 50

  timelimiter:
    instances:
      catalogCircuitBreaker:
        timeoutDuration: 4s

      orderCircuitBreaker:
        timeoutDuration: 4s

ticketcraft:
  gateway:
    concurrency:
      limits:
        catalog-service-route: ${GATEWAY_CATALOG_MAX_CONCURRENT:64}
        order-service-route: ${GATEWAY_ORDER_MAX_CONCURRENT:32}
    request-limits:
      max-body-size: ${GATEWAY_MAX_BODY_SIZE:64KB}
      body-read-timeout: ${GATEWAY_BODY_READ_TIMEOUT:5s}
    security:
      metrics-public: false
    catalog-uri: ${GATEWAY_CATALOG_URI:http://localhost:8081}
    order-uri: ${GATEWAY_ORDER_URI:http://localhost:8082}
    rate-limiter:
      timeout: 500ms
      warn-interval: 30s
    cors:
      allowed-origins:
        - http://localhost:3000
      allowed-methods:
        - GET
        - POST
      allowed-headers:
        - Authorization
        - Content-Type
        - X-Correlation-ID
        - Idempotency-Key
      exposed-headers:
        - X-Correlation-ID
        - Location
      max-age: 1h
    jwk:
      request-timeout: ${GATEWAY_JWK_REQUEST_TIMEOUT:2s}

management:
  otlp:
    metrics:
      export:
        enabled: false

  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics

  endpoint:
    health:
      show-details: never
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState

  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}

  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
