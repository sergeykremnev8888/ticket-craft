server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000
            response-timeout: 5s

          routes:
            - id: order-service-route
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/orders,/api/v1/orders/**

            - id: catalog-service-route
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/catalog/events,/api/v1/catalog/events/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: catalogCircuitBreaker
                - name: RequestRateLimiter
                  args:
                    rate-limiter: "#{@resilientRateLimiter}"
                    key-resolver: "#{@ipKeyResolver}"
                    '[redis-rate-limiter.replenishRate]': 10
                    '[redis-rate-limiter.burstCapacity]': 20
                    '[redis-rate-limiter.requestedTokens]': 1

            - id: catalog-debug
              uri: http://localhost:8081
              predicates:
                - Path=/debug/slow
              filters:
                - name: CircuitBreaker
                  args:
                    name: catalogCircuitBreaker
                    statusCodes: "503"

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9000/realms/ticketcraft
          audiences:
            - ticketcraft-api

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 500ms

resilience4j:
  circuitbreaker:
    instances:
      catalogCircuitBreaker:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        slowCallDurationThreshold: 2s
        slowCallRateThreshold: 50

  timelimiter:
    instances:
      catalogCircuitBreaker:
        timeoutDuration: 4s

ticketcraft:
  gateway:
    rate-limiter:
      timeout: 500ms
