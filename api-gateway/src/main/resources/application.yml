server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          httpclient:
            connect-timeout: 2000
            response-timeout: 5s

          routes:
            - id: order-service-route
              uri: http://localhost:8082
              predicates:
                - Path=/api/v1/orders,/api/v1/orders/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: orderCircuitBreaker
                    statusCodes: "503"
                    fallbackUri: forward:/fallback/order
                - name: RequestRateLimiter
                  args:
                    rate-limiter: "#{@resilientRateLimiter}"
                    key-resolver: "#{@ipKeyResolver}"
                    '[redis-rate-limiter.replenishRate]': 5
                    '[redis-rate-limiter.burstCapacity]': 10
                    '[redis-rate-limiter.requestedTokens]': 1

            - id: catalog-service-route
              uri: http://localhost:8081
              predicates:
                - Path=/api/v1/catalog/events,/api/v1/catalog/events/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: catalogCircuitBreaker
                    statusCodes: "503"
                    fallbackUri: forward:/fallback/catalog
                - name: RequestRateLimiter
                  args:
                    rate-limiter: "#{@resilientRateLimiter}"
                    key-resolver: "#{@ipKeyResolver}"
                    '[redis-rate-limiter.replenishRate]': 10
                    '[redis-rate-limiter.burstCapacity]': 20
                    '[redis-rate-limiter.requestedTokens]': 1

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9000/realms/ticketcraft
          audiences:
            - ticketcraft-api

  data:
    redis:
      host: localhost
      port: 6379
      timeout: 500ms

  reactor:
    context-propagation: auto

resilience4j:
  circuitbreaker:
    instances:
      catalogCircuitBreaker:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        slowCallDurationThreshold: 2s
        slowCallRateThreshold: 50

      orderCircuitBreaker:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 3
        slowCallDurationThreshold: 2s
        slowCallRateThreshold: 50

  timelimiter:
    instances:
      catalogCircuitBreaker:
        timeoutDuration: 4s

      orderCircuitBreaker:
        timeoutDuration: 4s

ticketcraft:
  gateway:
    rate-limiter:
      timeout: 500ms
    cors:
      allowed-origins:
        - http://localhost:3000
      allowed-methods:
        - GET
        - POST
      allowed-headers:
        - Authorization
        - Content-Type
        - X-Correlation-ID
        - Idempotency-Key
      exposed-headers:
        - X-Correlation-ID
        - Location
      max-age: 1h

management:
  otlp:
    metrics:
      export:
        enabled: false

  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when-authorized
  tracing:
    sampling:
      probability: 1.0

  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://localhost:4318/v1/traces
