spring:
  application:
    name: order-service

  profiles:
    default: local

  flyway:
    enabled: true
    locations: classpath:db/migration

  sql:
    init:
      mode: never

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

ticketcraft:
  outbox:
    publisher:
      enabled: true
      batch-size: 100
      fixed-delay: 1s
      lock-duration: 30s
      retry-delay: 5s
      send-timeout: 10s
      topic: order-events

logging:
  level:
    root: INFO
    "[ru.ticketcraft]": INFO
