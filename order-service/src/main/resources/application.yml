spring:
  application:
    name: order-service

  profiles:
    default: local

  flyway:
    enabled: true
    locations: classpath:db/migration

  sql:
    init:
      mode: never

  kafka:
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false

    producer:
      acks: all
      "[enable.idempotence]": true

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

ticketcraft:
  kafka:
    consumer:
      concurrency: 1
      ticket-reservation-results-group-id: ${ORDER_RESERVATION_RESULTS_GROUP_ID:order-ticket-reservation-results}
      payment-results-group-id: ${ORDER_PAYMENT_RESULTS_GROUP_ID:order-payment-results}

    topic:
      partitions: 1
      replicas: 1

    topics:
      order-events: order-events
      ticket-reservation-commands: ticket-reservation-commands
      ticket-reservation-results: ticket-reservation-results
      ticket-reservation-results-dlt: ticket-reservation-results.DLT
      payment-requests: payment-requests
      payment-results: payment-results
      payment-results-dlt: payment-results.DLT

  outbox:
    publisher:
      enabled: true
      batch-size: 100
      fixed-delay: 1s
      lock-duration: 30s
      retry-delay: 5s
      send-timeout: 10s

logging:
  level:
    root: INFO
    "[ru.ticketcraft]": INFO
