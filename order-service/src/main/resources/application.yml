spring:
  application:
    name: order-service

  profiles:
    default: local

  flyway:
    enabled: true
    locations: classpath:db/migration

  sql:
    init:
      mode: never

  kafka:
    consumer:
      group-id: order-ticket-reservation-results

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

ticketcraft:
  kafka:
    topics:
      order-events: order-events
      ticket-reservation-commands: ticket-reservation-commands
      ticket-reservation-results: ticket-reservation-results
      ticket-reservation-results-dlt: ticket-reservation-results.DLT
      payment-requests: payment-requests

  outbox:
    publisher:
      enabled: true
      batch-size: 100
      fixed-delay: 1s
      lock-duration: 30s
      retry-delay: 5s
      send-timeout: 10s

logging:
  level:
    root: INFO
    "[ru.ticketcraft]": INFO
