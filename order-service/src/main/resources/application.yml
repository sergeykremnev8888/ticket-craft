spring:
  application:
    name: order-service

  profiles:
    default: local

  flyway:
    enabled: true
    locations: classpath:db/migration

  sql:
    init:
      mode: never

  kafka:
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
       '[spring.json.type.mapping]': >-
        TicketReserved:ru.ticketcraft.dto.TicketReservedEvent,
        TicketReservationFailed:ru.ticketcraft.dto.TicketReservationFailedEvent,
        TicketConfirmed:ru.ticketcraft.dto.TicketConfirmedEvent,
        TicketConfirmationFailed:ru.ticketcraft.dto.TicketConfirmationFailedEvent,
        TicketReleased:ru.ticketcraft.dto.TicketReleasedEvent,
        PaymentSucceededEvent:ru.ticketcraft.dto.PaymentSucceededEvent,
        PaymentFailedEvent:ru.ticketcraft.dto.PaymentFailedEvent,
        PaymentRefundedEvent:ru.ticketcraft.dto.PaymentRefundedEvent
    producer:
      acks: all
      '[enable.idempotence]': true
    listener:
      observation-enabled: true
    template:
      observation-enabled: true

server:
  port: ${SERVER_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        '[http.server.requests]': true
      slo:
        '[http.server.requests]': 50ms,100ms,250ms,500ms,1s,2s,5s
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        enabled: false

ticketcraft:
  kafka:
    consumer:
      concurrency: 1
      ticket-reservation-results-group-id: ${ORDER_RESERVATION_RESULTS_GROUP_ID:order-ticket-reservation-results}
      payment-results-group-id: ${ORDER_PAYMENT_RESULTS_GROUP_ID:order-payment-results}
    topic:
      partitions: 1
      replicas: 1
    topics:
      order-events: order-events
      ticket-reservation-commands: ticket-reservation-commands
      ticket-reservation-results: ticket-reservation-results
      ticket-reservation-results-dlt: ticket-reservation-results.DLT
      payment-requests: payment-requests
      payment-commands: payment-commands
      payment-results: payment-results
      payment-results-dlt: payment-results.DLT

logging:
  level:
    root: INFO
    '[ru.ticketcraft]': INFO
  pattern:
    correlation: '[${spring.application.name:},%X{traceId:-},%X{spanId:-}] '
  include-application-name: false
