spring:
  datasource:
    url: jdbc:postgresql://postgres-order:5432/order_db
    username: ${ORDER_DB_USERNAME}
    password: ${ORDER_DB_PASSWORD}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:9000/realms/ticketcraft}
          jwk-set-uri: ${JWT_JWK_SET_URI:http://keycloak:8080/realms/ticketcraft/protocol/openid-connect/certs}
          audiences: ${JWT_AUDIENCE:ticketcraft-api}

ticketcraft:
  security:
    metrics-public: true

management:
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://jaeger:4318/v1/traces}
