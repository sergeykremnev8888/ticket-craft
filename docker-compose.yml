name: ticket-craft

include:
  - ./docker-compose.infra.yml

x-java-service: &java-service
  environment: &java-environment
    SPRING_PROFILES_ACTIVE: docker
    OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:-http://jaeger:4318/v1/traces}
    TRACING_SAMPLING_PROBABILITY: ${TRACING_SAMPLING_PROBABILITY:-1.0}
  healthcheck: &java-healthcheck
    test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "3", "http://localhost:8080/actuator/health"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 60s

x-connect-registration: &connect-registration
  image: ticketcraft/connect-registration:local
  build:
    context: ./docker/kafka-connect
    dockerfile: Dockerfile.registration
  restart: "no"
  volumes:
    - ./docker/kafka-connect:/bootstrap:ro

services:

  api-gateway:
    <<: *java-service
    image: ticketcraft/api-gateway:local
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    environment:
      <<: *java-environment
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:-http://localhost:9000/realms/ticketcraft}
      JWT_JWK_SET_URI: ${JWT_JWK_SET_URI:-http://keycloak:8080/realms/ticketcraft/protocol/openid-connect/certs}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-ticketcraft-api}
      GATEWAY_CATALOG_URI: ${GATEWAY_CATALOG_URI:-http://catalog-service:8081}
      GATEWAY_ORDER_URI: ${GATEWAY_ORDER_URI:-http://order-service:8082}
      GATEWAY_HTTP_POOL_MAX_CONNECTIONS: ${GATEWAY_HTTP_POOL_MAX_CONNECTIONS:-64}
      GATEWAY_HTTP_POOL_ACQUIRE_TIMEOUT_MS: ${GATEWAY_HTTP_POOL_ACQUIRE_TIMEOUT_MS:-500}
    ports:
      - "8080:8080"
    stop_grace_period: 45s
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "3", "http://localhost:8080/actuator/health/readiness"]
    depends_on:
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started
      catalog-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      jaeger:
        condition: service_started
      register-catalog-outbox:
        condition: service_completed_successfully
      register-order-outbox:
        condition: service_completed_successfully
      register-payment-outbox:
        condition: service_completed_successfully
      catalog-demo-data:
        condition: service_completed_successfully

  catalog-service:
    <<: *java-service
    image: ticketcraft/catalog-service:local
    build:
      context: .
      dockerfile: catalog-service/Dockerfile
    environment:
      <<: *java-environment
      CATALOG_DB_USERNAME: ${CATALOG_DB_USERNAME:?Set CATALOG_DB_USERNAME}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?Set CATALOG_DB_PASSWORD}
      CATALOG_DB_URL: jdbc:postgresql://${CATALOG_DB_HOST:-postgres-catalog}:${CATALOG_DB_PORT:-5432}/${CATALOG_DB_NAME:-catalog_db}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:-http://localhost:9000/realms/ticketcraft}
      JWT_JWK_SET_URI: ${JWT_JWK_SET_URI:-http://keycloak:8080/realms/ticketcraft/protocol/openid-connect/certs}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-ticketcraft-api}
    ports:
      - "8081:8081"
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "3", "http://localhost:8081/actuator/health"]
    depends_on:
      postgres-catalog:
        condition: service_healthy
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka-connect:
        condition: service_healthy
      keycloak:
        condition: service_started
      jaeger:
        condition: service_started

  order-service:
    <<: *java-service
    image: ticketcraft/order-service:local
    build:
      context: .
      dockerfile: order-service/Dockerfile
    environment:
      <<: *java-environment
      ORDER_DB_USERNAME: ${ORDER_DB_USERNAME:?Set ORDER_DB_USERNAME}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:?Set ORDER_DB_PASSWORD}
      ORDER_DB_URL: jdbc:postgresql://${ORDER_DB_HOST:-postgres-order}:${ORDER_DB_PORT:-5432}/${ORDER_DB_NAME:-order_db}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
      JWT_ISSUER_URI: ${JWT_ISSUER_URI:-http://localhost:9000/realms/ticketcraft}
      JWT_JWK_SET_URI: ${JWT_JWK_SET_URI:-http://keycloak:8080/realms/ticketcraft/protocol/openid-connect/certs}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-ticketcraft-api}
    ports:
      - "8082:8082"
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "3", "http://localhost:8082/actuator/health"]
    depends_on:
      postgres-order:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-connect:
        condition: service_healthy
      keycloak:
        condition: service_started
      jaeger:
        condition: service_started

  payment-service:
    <<: *java-service
    image: ticketcraft/payment-service:local
    build:
      context: .
      dockerfile: payment-service/Dockerfile
    environment:
      <<: *java-environment
      PAYMENT_DB_USERNAME: ${PAYMENT_DB_USERNAME:?Set PAYMENT_DB_USERNAME}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?Set PAYMENT_DB_PASSWORD}
      PAYMENT_DB_URL: jdbc:postgresql://${PAYMENT_DB_HOST:-postgres-payment}:${PAYMENT_DB_PORT:-5432}/${PAYMENT_DB_NAME:-payment_db}
      PAYMENT_PROVIDER_BASE_URL: ${PAYMENT_PROVIDER_BASE_URL:-http://payment-provider-stub:8090}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
    ports:
      - "8084:8084"
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "3", "http://localhost:8084/actuator/health"]
    depends_on:
      postgres-payment:
        condition: service_healthy
      kafka:
        condition: service_healthy
      kafka-connect:
        condition: service_healthy
      jaeger:
        condition: service_started
      payment-provider-stub:
        condition: service_started

  notification-service:
    <<: *java-service
    image: ticketcraft/notification-service:local
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    environment:
      <<: *java-environment
      NOTIFICATION_DB_USERNAME: ${NOTIFICATION_DB_USERNAME:?Set NOTIFICATION_DB_USERNAME}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?Set NOTIFICATION_DB_PASSWORD}
      NOTIFICATION_DB_URL: ${NOTIFICATION_DB_URL:-jdbc:postgresql://postgres-notification:5432/notification_db}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:29092}
    ports:
      - "8083:8083"
    healthcheck:
      <<: *java-healthcheck
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "3", "http://localhost:8083/actuator/health"]
    depends_on:
      postgres-notification:
        condition: service_healthy
      kafka:
        condition: service_healthy
      jaeger:
        condition: service_started

  payment-provider-stub:
    image: ticketcraft/payment-provider-stub:local
    build:
      context: ./docker/payment-provider-stub
    environment:
      SERVER_PORT: "8090"
    ports:
      - "8090:8090"

  register-catalog-outbox:
    <<: *connect-registration
    environment:
      CONNECTOR_CONFIG: /bootstrap/catalog-outbox.json
      DB_HOST: ${CATALOG_DB_HOST:-postgres-catalog}
      DB_PORT: ${CATALOG_DB_PORT:-5432}
      DB_NAME: ${CATALOG_DB_NAME:-catalog_db}
      DB_USERNAME: ${CATALOG_DB_USERNAME:?Set CATALOG_DB_USERNAME}
      DB_PASSWORD: ${CATALOG_DB_PASSWORD:?Set CATALOG_DB_PASSWORD}
    depends_on:
      kafka-connect:
        condition: service_healthy
      catalog-service:
        condition: service_healthy

  register-order-outbox:
    <<: *connect-registration
    environment:
      CONNECTOR_CONFIG: /bootstrap/order-outbox.json
      DB_HOST: ${ORDER_DB_HOST:-postgres-order}
      DB_PORT: ${ORDER_DB_PORT:-5432}
      DB_NAME: ${ORDER_DB_NAME:-order_db}
      DB_USERNAME: ${ORDER_DB_USERNAME:?Set ORDER_DB_USERNAME}
      DB_PASSWORD: ${ORDER_DB_PASSWORD:?Set ORDER_DB_PASSWORD}
    depends_on:
      kafka-connect:
        condition: service_healthy
      order-service:
        condition: service_healthy

  register-payment-outbox:
    <<: *connect-registration
    environment:
      CONNECTOR_CONFIG: /bootstrap/payment-outbox.json
      DB_HOST: ${PAYMENT_DB_HOST:-postgres-payment}
      DB_PORT: ${PAYMENT_DB_PORT:-5432}
      DB_NAME: ${PAYMENT_DB_NAME:-payment_db}
      DB_USERNAME: ${PAYMENT_DB_USERNAME:?Set PAYMENT_DB_USERNAME}
      DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?Set PAYMENT_DB_PASSWORD}
    depends_on:
      kafka-connect:
        condition: service_healthy
      payment-service:
        condition: service_healthy

  catalog-demo-data:
    image: postgres:16-alpine
    restart: "no"
    environment:
      PGHOST: ${CATALOG_DB_HOST:-postgres-catalog}
      PGPORT: ${CATALOG_DB_PORT:-5432}
      PGDATABASE: ${CATALOG_DB_NAME:-catalog_db}
      PGUSER: ${CATALOG_DB_USERNAME:?Set CATALOG_DB_USERNAME}
      PGPASSWORD: ${CATALOG_DB_PASSWORD:?Set CATALOG_DB_PASSWORD}
      PGCONNECT_TIMEOUT: "5"
    entrypoint: ["bash", "-ec"]
    command:
      - |
        if [ ! -s /seed/seed.sql ]; then
          echo "Demo seed SQL is missing or empty" >&2
          exit 1
        fi

        exec psql \
          --no-psqlrc \
          --no-password \
          --set=ON_ERROR_STOP=1 \
          --single-transaction \
          --file=/seed/seed.sql
    volumes:
      - ./catalog-service/src/main/resources/db/local/seed.sql:/seed/seed.sql:ro
    depends_on:
      catalog-service:
        condition: service_healthy
