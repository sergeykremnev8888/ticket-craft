version: '3.8'

services:
  # ==========================================
  # 1. БАЗЫ ДАННЫХ (PostgreSQL - Database-per-Service)
  # ==========================================
  postgres-catalog:
    image: postgres:16-alpine
    container_name: postgres-catalog
    environment:
      POSTGRES_DB: catalog_db
      POSTGRES_USER: catalog_user
      POSTGRES_PASSWORD: catalog_password
    ports:
      - "5432:5432"
    volumes:
      - pg_catalog_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog_user -d catalog_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-order:
    image: postgres:16-alpine
    container_name: postgres-order
    environment:
      POSTGRES_DB: order_db
      POSTGRES_USER: order_user
      POSTGRES_PASSWORD: order_password
    ports:
      - "5433:5432"
    volumes:
      - pg_order_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order_user -d order_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # 2. APACHE KAFKA (KRaft Mode без ZooKeeper)
  # ==========================================
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      # Уникальный целочисленный идентификатор брокера в кластере
      KAFKA_BROKER_ID: 1

      # Строка подключения к координатору ZooKeeper (хост и клиентский порт)
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181

      # Сопоставление протоколов безопасности для слушателей (PLAINTEXT — открытый трафик без SSL)
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT

      # Внешние адреса, которые брокер отдает клиентам для подключения:
      # - PLAINTEXT://kafka:29092 (для других docker-контейнеров)
      # - PLAINTEXT_HOST://localhost:9092 (для Java-приложений на хосте)
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092

      # Слушатель, используемый для передачи данных между брокерами Kafka
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # Число реплик системного топика __consumer_offsets (для 1 брокера = 1)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

      # Число реплик топика координатора транзакций (для 1 брокера = 1)
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1

      # Минимальное число реплик в синхроне для подтверждения транзакций продюсера (acks=all)
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ==========================================
  # 3. KAFKA UI (Визуализатор топиков и сообщений)
  # ==========================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: ticketcraft-kafka
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    depends_on:
      kafka:
        condition: service_healthy

volumes:
  pg_catalog_data:
    name: ticketcraft_pg_catalog_data
  pg_order_data:
    name: ticketcraft_pg_order_data
