spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false

ticketcraft:
  kafka:
    consumer:
      concurrency: 1

    topic:
      partitions: 1
      replicas: 1

logging:
  level:
    "[ru.ticketcraft]": DEBUG
