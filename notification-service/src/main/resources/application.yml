spring:
  datasource:
    url: ${NOTIFICATION_DB_URL:jdbc:postgresql://localhost:5434/notification_db}
    username: ${NOTIFICATION_DB_USERNAME:postgres}
    password: ${NOTIFICATION_DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 5000
  application:
    name: notification-service
  profiles:
    default: local
  kafka:
    listener:
      ack-mode: manual
      observation-enabled: true
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      acks: all
      '[enable.idempotence]': true
    consumer:
      enable-auto-commit: false
      group-id: ${KAFKA_CONSUMER_GROUP:notification-group}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        '[spring.json.trusted.packages]': ru.ticketcraft.dto
        '[spring.json.value.default.type]': ru.ticketcraft.dto.OrderEvent
    template:
      observation-enabled: true
server:
  port: ${SERVER_PORT:8083}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        enabled: false
ticketcraft:
  kafka:
    consumer:
      concurrency: 1
    retry:
      max-attempts: 3
      backoff-ms: 1000
    topic:
      source-topic: order-events
      dlt-topic: order-events.DLT
      partitions: 1
      replicas: 1
logging:
  level:
    root: INFO
    '[ru.ticketcraft]': INFO
  pattern:
    correlation: '[${spring.application.name:},%X{traceId:-},%X{spanId:-}] '
  include-application-name: false
