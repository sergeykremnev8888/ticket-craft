spring:
  application:
    name: payment-service

  profiles:
    default: local

  kafka:
    listener:
      ack-mode: manual

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer

    consumer:
      enable-auto-commit: false
      group-id: ${KAFKA_CONSUMER_GROUP:payment-group}
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        "[spring.json.trusted.packages]": ru.ticketcraft.dto

  datasource:
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:15}
      minimum-idle: ${DB_POOL_MIN_IDLE:5}

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8084}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

ticketcraft:
  kafka:
    topic:
      payment-requested: payment-requests
      payment-results: payment-results

    retry:
      max-attempts: 3
      backoff-ms: 1000
      dlt-topic: payment-requests.DLT

logging:
  level:
    root: INFO
    "[ru.ticketcraft.payment]": INFO
