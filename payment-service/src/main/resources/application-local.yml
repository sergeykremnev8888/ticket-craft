spring:
  datasource:
    url: jdbc:postgresql://localhost:5434/payment_db
    username: ${PAYMENT_DB_USERNAME:postgres}
    password: ${PAYMENT_DB_PASSWORD:postgres}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    consumer:
      group-id: payment-group

    producer:
      acks: all
      retries: 5

ticketcraft:
  kafka:
    topic:
      partitions: 1
      replicas: 1
