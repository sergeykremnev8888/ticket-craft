spring:
  application:
    name: catalog-service
  profiles:
    default: local
  cache:
    type: redis
  data:
    redis:
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_TIMEOUT:1s}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${CATALOG_KAFKA_GROUP_ID:catalog-ticket-reservation}
      auto-offset-reset: earliest
      enable-auto-commit: false
    producer:
      acks: all
      '[enable.idempotence]': true
    listener:
      observation-enabled: true
    template:
      observation-enabled: true
server:
  port: ${SERVER_PORT:8081}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,250ms,500ms,1s,2s,5s
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: ${OTEL_EXPORTER_OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}
  otlp:
    metrics:
      export:
        enabled: false
catalog:
  reservation:
    duration: ${RESERVATION_DURATION:10m}
    expiration-check-interval: ${RESERVATION_EXPIRATION_CHECK_INTERVAL:10s}
  cache:
    events-ttl: ${CATALOG_EVENTS_CACHE_TTL:5m}
ticketcraft:
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    catalog-read:
      capacity: ${CATALOG_READ_RATE_LIMIT_CAPACITY:120}
      refill-tokens: ${CATALOG_READ_RATE_LIMIT_REFILL_TOKENS:120}
      refill-period: ${CATALOG_READ_RATE_LIMIT_REFILL_PERIOD:1m}
  kafka:
    consumer:
      concurrency: 1
    topic:
      partitions: 1
      replicas: 1
    topics:
      ticket-reservation-commands: ticket-reservation-commands
      ticket-reservation-commands-dlt: ticket-reservation-commands.DLT
      ticket-reservation-results: ticket-reservation-results
  outbox:
    publisher:
      enabled: true
      batch-size: 100
      fixed-delay: 1s
      lock-duration: 30s
      retry-delay: 5s
      send-timeout: 10s
logging:
  level:
    root: INFO
    '[ru.ticketcraft]': INFO
  pattern:
    correlation: '[${spring.application.name:},%X{traceId:-},%X{spanId:-}] '
  include-application-name: false
