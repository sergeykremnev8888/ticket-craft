spring:
  application:
    name: catalog-service

  profiles:
    default: local

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

    show-sql: false

  sql:
    init:
      mode: never

  flyway:
    enabled: true
    locations: classpath:db/migration

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: catalog-ticket-reservation
      auto-offset-reset: earliest

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

  endpoint:
    health:
      probes:
        enabled: true

catalog:
  reservation:
    duration: ${RESERVATION_DURATION:10m}
    expiration-check-interval: ${RESERVATION_EXPIRATION_CHECK_INTERVAL:10s}

ticketcraft:
  kafka:
    topics:
      ticket-reservation-commands: ticket-reservation-commands

logging:
  level:
    root: INFO
    "[ru.ticketcraft]": INFO
