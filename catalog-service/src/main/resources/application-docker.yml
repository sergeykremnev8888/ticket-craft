spring:
  datasource:
    url: jdbc:postgresql://postgres-catalog:5432/catalog_db
    username: ${CATALOG_DB_USERNAME}
    password: ${CATALOG_DB_PASSWORD}

  kafka:
    bootstrap-servers: kafka:29092

  data:
    redis:
      url: redis://redis:6379

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:9000/realms/ticketcraft
          jwk-set-uri: http://keycloak:8080/realms/ticketcraft/protocol/openid-connect/certs
          audiences:
            - ticketcraft-api

ticketcraft:
  security:
    metrics-public: true
